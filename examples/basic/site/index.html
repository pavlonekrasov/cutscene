<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: oklch(0.965 0 0);
        --panel: oklch(1 0 0);
        --text: oklch(0.2 0 0);
        --muted: oklch(0.52 0 0);
        --line: oklch(0.91 0 0);
        --accent: oklch(0.55 0.2 264);
        --accent-text: oklch(1 0 0);
        --done: oklch(0.6 0.13 150);
        --font-sans: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: oklch(0.18 0 0);
          --panel: oklch(0.23 0 0);
          --text: oklch(0.96 0 0);
          --muted: oklch(0.72 0 0);
          --line: oklch(0.32 0 0);
          --accent: oklch(0.62 0.19 264);
          --done: oklch(0.72 0.14 150);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--canvas);
        color: var(--text);
        font: 15px/1.5 var(--font-sans);
        padding: 8px;
      }
      main {
        min-height: calc(100dvh - 16px);
        max-width: 960px;
        margin: 0 auto;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--line);
        padding: clamp(20px, 4vw, 40px);
      }
      h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); }
      form { display: flex; gap: 8px; margin-bottom: 24px; }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: inherit;
        font: inherit;
      }
      input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        font: 500 15px var(--font-sans);
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      li { border-bottom: 1px solid var(--line); }
      label { display: flex; align-items: center; gap: 12px; padding: 14px 4px; cursor: pointer; }
      input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
      li:has(:checked) span { color: var(--muted); text-decoration: line-through; }
      li.new { animation: enter 260ms cubic-bezier(0.2, 0, 0, 1); }
      @keyframes enter { from { opacity: 0; translate: 0 -6px; } }
      .toast {
        position: fixed;
        left: 50%;
        top: 24px;
        translate: -50% -12px;
        opacity: 0;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--text);
        color: var(--panel);
        font-weight: 500;
        transition: opacity 200ms ease-out, translate 200ms ease-out;
      }
      .toast[data-on] { opacity: 1; translate: -50% 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tasks</h1>
      <p>A tiny app to record. Nothing here is saved.</p>
      <form>
        <input type="text" name="task" aria-label="New task" placeholder="What needs doing?" />
        <button type="submit">Add task</button>
      </form>
      <ul aria-label="Tasks">
        <li><label><input type="checkbox" /> <span>Draft the release notes</span></label></li>
        <li><label><input type="checkbox" checked /> <span>Review the onboarding copy</span></label></li>
        <li><label><input type="checkbox" /> <span>Book the team retro</span></label></li>
      </ul>
    </main>
    <div class="toast" role="status"></div>
    <script>
      const form = document.querySelector("form");
      const list = document.querySelector("ul");
      const toast = document.querySelector(".toast");
      let timer;
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = form.task.value.trim();
        if (!text) return;
        const item = document.createElement("li");
        item.className = "new";
        item.innerHTML = '<label><input type="checkbox" /> <span></span></label>';
        item.querySelector("span").textContent = text;
        list.prepend(item);
        form.reset();
        toast.textContent = "Task added";
        toast.toggleAttribute("data-on", true);
        clearTimeout(timer);
        timer = setTimeout(() => toast.removeAttribute("data-on"), 1800);
      });
    </script>
  </body>
</html>
